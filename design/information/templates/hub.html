<!--meta
title: Hub
tag: answers up front, doors for the long reads
files: js/pages/Information.js · css/pages/information.css
state: every door opens — try each one
idea: The page answers first and files second. The hero says what the list is and offers the full version at the end of the sentence; under it a search field that covers everything on the page. Then six blocks, sized by weight and ordered by what a visitor most often arrives wanting: the FAQ first, the navigation beside it — every page on the site with a paragraph on what is actually in it — then the guidelines running down the left with the reference, the staff and the API stacked beside them. Nothing long is ever <em>on</em> the hub. The reference is the exception, because it is nineteen short rows and hiding it would cost more space than printing it.
weight: Column span and nothing else, because no block holds enough content to argue with it: the guidelines take seven of twelve columns and three rows, the navigation takes seven in row one, and the FAQ, reference, staff and API are the five-column remainder. The two legends are one block rather than two, so nineteen rows of lookup can no longer take a section's worth of page.
cost: Middling. The page is static markup; the doors need one modal component with a scroll lock, focus trap and Escape handling, used seven times. The navigation copy and the API block are the only genuinely new writing.
watch: Everything is behind a click now, so the counts on the faces are doing real work and the search field has to reach inside closed blocks or it is decoration. Each window also needs a URL of its own (/information?open=api) or a rule cannot be linked, and Back must close it rather than leave the page. The row-1 blocks sit on the mirrored column split of the rows below them &mdash; 5 + 7 against 7 + 5 &mdash; so the outer edges line up but the internal one moves.
-->
