<!--meta
title: Filters & settings
route: any list page
files: js/pages/Mobile.js · css/pages/mobile.css
problem: Filters and settings open as a centred popup with its own scroll box and a hand-drawn "⌄" hint underneath, so the Apply and Reset buttons land in the middle of the screen, away from the thumb. The filter rows are check-boxes stacked one per line, which needs a long scroll to reach the tag you want. The theme toggle labels the buttons Dark and Light while the class that drives it is inverted, which is why the desktop settings and this one disagree about which is which.
change: A bottom sheet: the actions sit at the bottom edge where the thumb already is, and the filters become a wrapped chip field so most of the list is visible without scrolling. The two numeric filters keep their own row. Settings uses the same sheet, with the same four toggles the current build has and no more.
-->
